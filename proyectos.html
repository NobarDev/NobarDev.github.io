<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos | Jhonsons González</title>
    <meta name="description" content="Galería de proyectos de desarrollo web y videojuegos de Jhonsons González.">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body style="overflow-y: auto;">

    <!-- NAV BAR -->
    <header>
        <nav class="nav-container">
            <a href="index.html" class="logo">
                JHONSONS<span>G.</span>
                <span class="logo-dot"></span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html#hero">Inicio</a></li>
                <li><a href="portafolio.html">Portafolio</a></li>
                <li><a href="index.html#contactos">Contacto</a></li>
            </ul>
            <button class="burger" aria-label="Abrir menú">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </button>
        </nav>
    </header>

    <!-- CONTENT -->
    <main class="subpage-container">
        <header class="subpage-header">
            <h1 class="subpage-title">Proyectos</h1>
            <p class="subpage-subtitle">Explora mi catálogo de desarrollo de software, sitios web responsivos e
                integraciones de videojuegos de estética retro-futurista.</p>
        </header>

        <!-- Filter tabs -->
        <ul class="filter-tabs">
            <li><button class="filter-btn active" data-filter="all">Todos</button></li>
            <li><button class="filter-btn" data-filter="web">Desarrollo Web</button></li>
            <li><button class="filter-btn" data-filter="game">Videojuegos</button></li>
        </ul>

        <!-- Projects grid -->
        <div class="projects-grid">
            <!-- Cargado dinámicamente -->
        </div><!-- /.projects-grid -->
    </main>

    <!-- FOOTER -->
    <footer style="margin-top: 5rem;">
        <p>&copy; 2026 Jhonsons González. Todos los derechos reservados. Diseñado & programado con <span
                class="highlight-orange">Pasión</span>.</p>
    </footer>

    <!-- PDF.js Library for PDF Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Main JavaScript -->
    <script src="js/main.js"></script>
    <!-- Auto-inject published cards from JSON -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.querySelector('.projects-grid');
            if (!grid) return;

            try {
                let data;
                const localSync = localStorage.getItem('local_sync_publicaciones');
                if ((window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') && localSync) {
                    data = JSON.parse(localSync);
                } else {
                    const response = await fetch('data/publicaciones.json');
                    if (!response.ok) throw new Error('Network response was not ok');
                    data = await response.json();
                }
                const cards = data.proyectos || [];

                cards.forEach((card) => {
                    if (!card) return;
                    const tagsArr = Array.isArray(card.tags) ? card.tags : [];
                    const dataType = card.isPdf ? ' data-type="pdf"' : '';

                    let finalThumbSrc = card.thumbnailSrc || 'assets/art_piece_1.png';
                    let finalFileSrc = card.fileSrc || '#';

                    // Determine category and badge class based on tags
                    const isGame = tagsArr.some(t => t.toLowerCase().includes('game') || t.toLowerCase().includes('juego'));
                    const isWeb = tagsArr.some(t => t.toLowerCase().includes('web') || t.toLowerCase().includes('software') || t.toLowerCase().includes('console') || t.toLowerCase().includes('dashboard'));
                    let categoryAttr = '';
                    if (isGame) categoryAttr += 'game ';
                    if (isWeb) categoryAttr += 'web ';
                    if (!categoryAttr) categoryAttr = 'web';
                    categoryAttr = categoryAttr.trim();

                    const badgesHTML = tagsArr.map(t => {
                        const isG = t.toLowerCase().includes('game') || t.toLowerCase().includes('juego');
                        const badgeClass = isG ? 'badge-game' : 'badge-web';
                        return `<span class="project-badge ${badgeClass}">${t}</span>`;
                    }).join('');

                    const dateHTML = card.date ? `<span style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted);">${card.date}</span>` : '';

                    const cardId = card.id || Date.now().toString();

                    let linksHTML = '';
                    if (isGame) {
                        linksHTML = `
                        <a href="https://github.com" target="_blank" class="project-link highlight-green">
                            <i class="fa-brands fa-github"></i> Repositorio
                        </a>
                        <a href="${finalFileSrc}" class="project-link highlight-purple view-media-btn" id="btn-${cardId}" data-title="${card.title}"${dataType}>
                            <i class="fa-solid fa-play"></i> Jugar
                        </a>`;
                    } else {
                        linksHTML = `
                        <a href="https://github.com" target="_blank" class="project-link highlight-green">
                            <i class="fa-brands fa-github"></i> Código
                        </a>
                        <a href="${finalFileSrc}" class="project-link highlight-orange view-media-btn" id="btn-${cardId}" data-title="${card.title}"${dataType}>
                            <i class="fa-solid fa-eye"></i> Ver
                        </a>`;
                    }

                    const articleHTML = `
                    <article class="project-card" data-category="${categoryAttr}" data-card-id="${cardId}" style="animation: fadeIn 0.4s ease forwards;">
                        <div class="project-thumbnail">
                            <img src="${finalThumbSrc}" alt="${card.title}" id="img-${cardId}" data-original-src="${finalThumbSrc}" onerror="if (!this.dataset.tried) { this.dataset.tried = '1'; this.src = 'https://raw.githubusercontent.com/NobarDev/NobarDev.github.io/main/' + this.dataset.originalSrc; }">
                        </div>
                        <div class="project-details">
                            <div class="project-meta">
                                ${badgesHTML}
                                ${dateHTML}
                            </div>
                            <h2 class="project-title">${card.title}</h2>
                            <p class="project-description">${card.description}</p>
                            <div class="project-links">
                                ${linksHTML}
                            </div>
                        </div>
                    </article>`;
                    grid.insertAdjacentHTML('beforeend', articleHTML);
                });

                // Trigger main.js filter bind if cards are added asynchronously
                window.dispatchEvent(new Event('resize'));
            } catch (error) {
                console.error("Error cargando proyectos:", error);
            }
        });
    </script>
</body>

</html>
