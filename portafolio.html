<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Ilustración | Jhonsons González</title>
    <meta name="description"
        content="Galaría de diseño gráfico e ilustraciones digitales de Jhonsons González al estilo Behance.">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body style="overflow-y: auto;">

    <!-- NAV BAR -->
    <header>
        <nav class="nav-container">
            <a href="index.html" class="logo">
                JHONSONS<span>G.</span>
                <span class="logo-dot"></span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html#hero">Inicio</a></li>
                <li><a href="proyectos.html">Proyectos</a></li>
                <li><a href="index.html#contactos">Contacto</a></li>
            </ul>
            <button class="burger" aria-label="Abrir menú">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </button>
        </nav>
    </header>

    <!-- CONTENT -->
    <main class="subpage-container">
        <header class="subpage-header">
            <h1 class="subpage-title">Diseño & Arte</h1>
            <p class="subpage-subtitle">Una colección de mis mejores ilustraciones digitales, afiches conceptuales y
                branding visual con una estética steampunk industrial.</p>
        </div>
        
        <!-- Behance Grid -->
        <div class="behance-grid">
            <!-- Cargado dinámicamente -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer style="margin-top: 5rem;">
        <p>&copy; 2026 Jhonsons González. Todos los derechos reservados. Diseñado & programado con <span
                class="highlight-orange">Pasión</span>.</p>
    </footer>

    <!-- PDF.js Library for PDF Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="js/fileStore.js"></script>
    <!-- Main JavaScript -->
    <script src="js/main.js"></script>
    <!-- Auto-inject published cards from JSON -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.querySelector('.behance-grid');
            if (!grid) return;

            try {
                let data;
                const localSync = localStorage.getItem('local_sync_publicaciones');
                if ((window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') && localSync) {
                    data = JSON.parse(localSync);
                } else {
                    const response = await fetch('data/publicaciones.json');
                    if (!response.ok) throw new Error('Network response was not ok');
                    data = await response.json();
                }
                const cards = data.portafolio || [];

                cards.forEach((card) => {
                    if (!card) return;
                    const tagsArr = Array.isArray(card.tags) ? card.tags : [];
                    const tagsHTML = tagsArr.map(t => `<span class="behance-tag">${t}</span>`).join('');
                    const dataType = card.isPdf ? ' data-type="pdf"' : '';

                    let finalThumbSrc = card.thumbnailSrc || 'assets/art_piece_1.png';
                    let finalFileSrc = card.fileSrc || '#';

                    const cardId = card.id || Date.now().toString();
                    const articleHTML = `
                    <article class="behance-card" data-card-id="${cardId}" style="animation: fadeIn 0.4s ease forwards;">
                        <div class="behance-media">
                            <img src="${finalThumbSrc}" alt="${card.title}" id="img-${cardId}" data-original-src="${finalThumbSrc}" onerror="if (!this.dataset.tried) { this.dataset.tried = '1'; this.src = 'https://raw.githubusercontent.com/NobarDev/NobarDev.github.io/main/' + this.dataset.originalSrc; }">
                        </div>
                        <div class="behance-info">
                            <div class="behance-meta">
                                <div class="behance-tags">${tagsHTML}</div>
                                <h2 class="behance-title">${card.title}</h2>
                                <p class="behance-description">${card.description}</p>
                            </div>
                            <a href="${finalFileSrc}" class="behance-btn view-media-btn" id="btn-${cardId}" data-title="${card.title}"${dataType}>Ver</a>
                        </div>
                    </article>`;
                    grid.insertAdjacentHTML('beforeend', articleHTML);
                });
            } catch (error) {
                console.error("Error cargando portafolio:", error);
            }
        });
    </script>
</body>

</html>
